plugins {
    // This plugin provides the "magic" to find Minecraft classes
    id 'net.neoforged.gradle.userdev' version '7.1.20' // Use a recent NeoGradle version

    // These plugins handle building and publishing a standard library JAR
    id 'java-library'
    id 'maven-publish'
}

group = library_group
version = library_version
def library_artifact_id = project.findProperty("library_artifact") ?: "material-lib"

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
    withSourcesJar()
}

repositories {
    mavenCentral()
}

dependencies {
    compileOnly "net.neoforged:neoforge:${neo_version}"
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.0'
}

test {
    useJUnitPlatform()
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            groupId = group
            artifactId = library_artifact_id
            version = version

            from components.java
        }
    }

    repositories {
        maven {
            name = "GitHubPackages"
            url = uri("https://maven.pkg.github.com/theelementguy/material-lib")

            credentials {
                username = project.findProperty("gpr.user") ?: System.getenv("GITHUB_ACTOR")
                password = project.findProperty("gpr.key") ?: System.getenv("GITHUB_TOKEN")
            }
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}